name: verbier-watch
on:
  schedule:
    - cron: "17 6 * * *"    # 07h17 heure suisse (hiver) : session du matin
    - cron: "47 10 * * *"   # 11h47 heure suisse (hiver) : session de l'après-midi
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer une notification de test"
        type: boolean
        default: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST: ${{ inputs.test }}
